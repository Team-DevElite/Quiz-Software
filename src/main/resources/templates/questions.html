<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Questions — Quizzer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        h1 {
            margin: 0;
            font-size: 1.875rem;
            color: var(--text-main);
        }

        .subtitle {
            margin: 0.25rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.15s ease-in-out, border-color 0.15s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #ffffff;
            color: var(--text-main);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background-color: #f1f5f9;
        }

        .btn-danger {
            background-color: #fee2e2;
            color: var(--danger);
            border-color: #fecaca;
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: #ffffff;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.8125rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
            padding: 0.75rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.55rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-success {
            background-color: #dcfce7;
            color: var(--success);
        }

        .badge-draft {
            background-color: #f1f5f9;
            color: var(--text-muted);
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .empty-state {
            padding: 3rem 1rem;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state p {
            margin: 0.5rem 0 1.25rem 0;
        }

        .breadcrumb {
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
        }

        .badge-easy {
            background-color: #dcfce7;
            color: var(--success);
        }

        .badge-normal {
            background-color: #dbeafe;
            color: var(--primary);
        }

        .badge-hard {
            background-color: #fee2e2;
            color: var(--danger);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="breadcrumb">
            <a th:href="@{/quizzes}">Quizzes</a> &rsaquo;
            <span th:text="${quiz.name}">Quiz</span> &rsaquo; Questions
        </div>

        <header>
            <div>
                <h1 th:text="${quiz.name}">Quiz name</h1>
                <p class="subtitle">Questions in this quiz</p>
            </div>
            <div>
                <a th:href="@{/quizzes/{quizId}/questions/add(quizId=${quiz.id})}" class="btn btn-primary">+ Add New
                    Question</a>
            </div>
        </header>

        <div class="card">
            <div th:if="${#lists.isEmpty(questions)}" class="empty-state">
                <h3>No questions found</h3>
                <p>This quiz doesn't have any questions yet.</p>
                <a th:href="@{/quizzes/{quizId}/questions/add(quizId=${quiz.id})}" class="btn btn-primary">Create a
                    Question</a>
            </div>

            <table th:unless="${#lists.isEmpty(questions)}">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Question</th>
                        <th>Difficulty</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="question, stat : ${questions}">
                        <td th:text="${stat.count}">1</td>
                        <td style="font-weight: 600;" th:text="${question.questionText}">Question text</td>
                        <td>
                            <span class="badge"
                                th:classappend="${question.difficulty == 'Easy'} ? 'badge-easy' : (${question.difficulty == 'Hard'} ? 'badge-hard' : 'badge-normal')"
                                th:text="${question.difficulty}">Normal</span>
                        </td>
                        <td>
                            <div class="actions-cell">
                                <a th:href="@{/questions/{id}/options(id=${question.id})}"
                                    class="btn btn-secondary btn-sm">Options</a>
                                <a th:href="@{/questions/delete/{id}(id=${question.id})}" class="btn btn-danger btn-sm"
                                    onclick="return confirm('Are you sure you want to delete this question and all its answer options?');">Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
