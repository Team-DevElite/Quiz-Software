<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Answer Option — Quizzer</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f8fafc; padding: 2rem; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; border: 1px solid #e2e8f0; }
        input[type="text"] { width: 100%; padding: 0.6rem; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 1rem; box-sizing: border-box; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #fff; border: 1px solid #e2e8f0; color: #0f172a; }
    </style>
</head>
<body>
<div class="container">
    <p><a th:href="@{/questions/{id}/options(id=${question.id})}" style="color: #2563eb; text-decoration: none;">← Back to Options</a></p>
    
    <div class="card">
        <h2>Add Answer Option</h2>
        <p style="color: #64748b; font-size: 0.9rem;" th:text="'For question: ' + ${question.questionText}"></p>

        <form th:action="@{/questions/{id}/options/add(id=${question.id})}" th:object="${option}" method="post">
            <label for="optionText" style="display:block; font-weight:600; margin-bottom: 0.5rem;">Option Text</label>
            <input type="text" id="optionText" th:field="*{optionText}" required placeholder="e.g. Finding ways to improve the process">

            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem;">
                <input type="checkbox" id="isCorrect" th:field="*{isCorrect}">
                <label for="isCorrect">This is the correct answer</label>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                <a th:href="@{/questions/{id}/options(id=${question.id})}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Option</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
