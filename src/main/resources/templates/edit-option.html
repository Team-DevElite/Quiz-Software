<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Answer Option — Quizzer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; padding: 2rem; color: #0f172a; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); }
        h2 { margin-top: 0; }
        input[type="text"] { width: 100%; padding: 0.6rem; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 1rem; box-sizing: border-box; font-size: 0.9rem; }
        input[type="text"]:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #fff; border: 1px solid #e2e8f0; color: #0f172a; }
        .btn-secondary:hover { background: #f1f5f9; }
    </style>
</head>
<body>
<div class="container">
    <p><a th:href="@{/questions/{id}/options(id=${question.id})}" style="color: #2563eb; text-decoration: none;">← Back to Options</a></p>
    
    <div class="card">
        <h2>Edit Answer Option</h2>
        <p style="color: #64748b; font-size: 0.9rem;" th:text="'For question: ' + ${question.questionText}"></p>

        <form th:action="@{/options/edit/{id}(id=${option.id})}" th:object="${option}" method="post">
            <label for="optionText" style="display:block; font-weight:600; margin-bottom: 0.5rem;">Option Text</label>
            <input type="text" id="optionText" th:field="*{optionText}" required placeholder="e.g. Finding ways to improve the process">

            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem;">
                <input type="checkbox" id="isCorrect" th:field="*{isCorrect}">
                <label for="isCorrect" style="cursor: pointer;">This is the correct answer</label>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                <a th:href="@{/questions/{id}/options(id=${question.id})}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Option</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
