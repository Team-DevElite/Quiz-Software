<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — Quizzer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        h1 {
            margin: 0;
            font-size: 1.875rem;
            color: var(--text-main);
        }

        .subtitle {
            margin: 0.25rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.15s ease-in-out, border-color 0.15s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #ffffff;
            color: var(--text-main);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background-color: #f1f5f9;
        }

        .btn-danger {
            background-color: #fee2e2;
            color: var(--danger);
            border-color: #fecaca;
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: #ffffff;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.8125rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            overflow-wrap: anywhere;
        }

        th {
            background-color: #f1f5f9;
            padding: 0.75rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .empty-state {
            padding: 3rem 1rem;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state p {
            margin: 0.5rem 0 1.25rem 0;
        }
    </style>
</head>
<body>
<main class="container">
    <nav aria-label="Teacher navigation" style="display:flex; gap:0.75rem; margin-bottom:1.5rem">
        <a class="btn btn-secondary" th:href="@{/quizzes}">Quizzes</a>
        <a class="btn btn-secondary" th:href="@{/categories}" aria-current="page">Categories</a>
    </nav>

    <header>
        <div>
            <h1>Categories</h1>
            <p class="subtitle">Teacher Dashboard — Manage Quiz Categories</p>
        </div>
        <div>
            <a class="btn btn-primary" th:href="@{/categories/add}">+ Add Category</a>
        </div>
    </header>

    <section class="card">
        <div th:if="${#lists.isEmpty(categories)}" class="empty-state">
            <h3>No categories found</h3>
            <p>No categories have been added yet.</p>
            <a class="btn btn-primary" th:href="@{/categories/add}">Create a Category</a>
        </div>

        <table th:unless="${#lists.isEmpty(categories)}">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Description</th>
                <th scope="col">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td style="font-weight: 600;" th:text="${category.name}">Agile</td>
                <td style="color: var(--text-muted);" th:text="${category.description}">Agile principles</td>
                <td>
                    <div class="actions-cell">
                        <a th:href="@{/categories/delete/{id}(id=${category.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this category? Associated quizzes will become uncategorized.');">Delete</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
